name: Build PhoneCtrl (Windows)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish single-file exe
        run: >
          dotnet publish src/PhoneCtrl/PhoneCtrl.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      # Release assets don't count against the Actions artifact storage quota.
      - name: Publish "latest build" download
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/PhoneCtrl.exe -DestinationPath PhoneCtrl-win-x64.zip
          gh release delete latest-build --cleanup-tag --yes 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest-build PhoneCtrl-win-x64.zip --prerelease --target $env:GITHUB_SHA `
            --title "Latest build ($env:GITHUB_REF_NAME)" `
            --notes "Automatic build of commit $env:GITHUB_SHA. Download PhoneCtrl-win-x64.zip, extract, run PhoneCtrl.exe."

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish/PhoneCtrl.exe -DestinationPath PhoneCtrl-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhoneCtrl-win-x64.zip
